<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virage 3D — course arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#91c7e8;color:#f7faf8;font-family:system-ui,sans-serif}#game{display:block;width:100vw;height:100vh}.panel{position:fixed;z-index:2;top:16px;left:16px;width:280px;padding:16px;border:1px solid #ffffff30;border-radius:16px;background:#0d1b15eF;box-shadow:0 12px 40px #0007}.eyebrow{color:#83efbb;font-size:11px;font-weight:800;letter-spacing:.14em}h1{margin:4px 0 12px;font-size:26px}label,small{display:block;color:#b3c2b9}select,button{width:100%;margin-top:8px;min-height:40px;border:0;border-radius:9px;padding:8px;font:inherit}select{background:#1d3027;color:white}button{background:#70e6ae;color:#092116;font-weight:800;cursor:pointer}.stats{display:flex;justify-content:space-between;margin-top:12px;padding:10px;border-radius:10px;background:#ffffff12}.help{font-size:12px;color:#c5d0ca;line-height:1.5}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:20px;background:#0d1b15eF;color:white;display:none}@media(max-width:600px){.panel{top:8px;left:8px;width:220px;padding:11px}.help{font-size:10px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Jeu de course en 3D"></canvas>
<section class="panel"><div class="eyebrow">COURSE ARCADE · 3D</div><h1>VIRAGE.</h1><label for="map">Choisis ton circuit</label><select id="map"><option value="prairie">Prairie</option><option value="desert">Désert</option><option value="loop">Looping</option></select><button id="restart">Recommencer la course</button><div class="stats"><div><small>Vitesse</small><strong><span id="speed">0</span> km/h</strong></div><div><small>Tour</small><strong><span id="lap">1</span> / 3</strong></div></div><p class="help"><b>Conduire :</b> ↑ / W accélérer · ↓ / S freiner · ← → / A D tourner<br>R pour recommencer.</p></section><div class="toast" id="toast">Course terminée ! Appuie sur R pour rejouer.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const canvas=document.querySelector('#game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#91c7e8');scene.fog=new THREE.Fog('#91c7e8',55,115);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,180);
scene.add(new THREE.HemisphereLight(0xe4f6ff,0x35402c,2));const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-25,40,-20);sun.castShadow=true;scene.add(sun);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness});
let world=new THREE.Group(),carMesh,angle=0,speed=0,lap=1,lastAngle=0,finished=false,last=performance.now();scene.add(world);const keys=Object.create(null),radius=19.5;
function makeCar(){const g=new THREE.Group(),red=mat('#e83d43',.28),glass=new THREE.MeshStandardMaterial({color:'#86d7e9',metalness:.2,roughness:.2});
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.66,1.75,6,16),red);body.rotation.x=Math.PI/2;body.scale.set(1,.72,.72);body.position.y=.57;body.castShadow=true;g.add(body);
const hood=new THREE.Mesh(new THREE.SphereGeometry(.68,18,12),mat('#ff6464',.28));hood.scale.set(.78,.28,1.05);hood.position.set(0,.66,.92);hood.castShadow=true;g.add(hood);
const cabin=new THREE.Mesh(new THREE.SphereGeometry(.65,18,12),mat('#172d3a',.24));cabin.scale.set(.76,.55,.72);cabin.position.set(0,1.02,-.05);cabin.castShadow=true;g.add(cabin);
const roof=new THREE.Mesh(new THREE.SphereGeometry(.52,16,10),glass);roof.scale.set(.75,.35,.72);roof.position.set(0,1.24,-.08);g.add(roof);
const wheels=mat('#111719');for(const x of [-.68,.68])for(const z of [-.88,.88]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.2,18),wheels);w.rotation.z=Math.PI/2;w.position.set(x,.34,z);w.castShadow=true;g.add(w)}
const lampMat=new THREE.MeshStandardMaterial({color:'#fff0af',emissive:'#ffe68a',emissiveIntensity:1.8});for(const x of [-.42,.42]){const l=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),lampMat);l.position.set(x,.65,1.52);g.add(l)}
return g}
function buildTrack(){scene.remove(world);world=new THREE.Group();scene.add(world);const colors={prairie:['#91c7e8','#679653','#303a35'],desert:['#f0b879','#c89b5c','#4a3b31'],loop:['#a7c7f5','#6576a5','#303746']}[document.querySelector('#map').value];scene.background.set(colors[0]);scene.fog.color.set(colors[0]);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),mat(colors[1]));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;world.add(ground);
const road=new THREE.Mesh(new THREE.RingGeometry(16,23,160),mat(colors[2],.95));road.rotation.x=-Math.PI/2;road.position.y=.025;road.receiveShadow=true;world.add(road);
const curb=new THREE.Mesh(new THREE.RingGeometry(15.7,16.15,160),mat('#f3eee1'));curb.rotation.x=-Math.PI/2;curb.position.y=.04;world.add(curb);const curb2=new THREE.Mesh(new THREE.RingGeometry(22.85,23.3,160),mat('#d34a43'));curb2.rotation.x=-Math.PI/2;curb2.position.y=.04;world.add(curb2);
const center=new THREE.Mesh(new THREE.RingGeometry(4,15.7,96),mat(colors[1]));center.rotation.x=-Math.PI/2;center.position.y=.01;world.add(center);
for(let i=0;i<48;i++){const a=i*Math.PI/24;const dash=new THREE.Mesh(new THREE.BoxGeometry(.12,.025,1.05),mat('#f5f2e9'));dash.position.set(Math.sin(a)*19.5,.075,Math.cos(a)*19.5);dash.rotation.y=a;world.add(dash)}
for(let i=0;i<12;i++){const a=i*Math.PI/6;const tree=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.17,.9,7),mat('#62452d'));trunk.position.y=.45;tree.add(trunk);const top=new THREE.Mesh(new THREE.ConeGeometry(.68,1.8,8),mat('#315c3c'));top.position.y=1.65;top.castShadow=true;tree.add(top);tree.position.set(Math.sin(a)*30,0,Math.cos(a)*30);world.add(tree)}
const line=new THREE.Mesh(new THREE.BoxGeometry(7,.04,.65),mat('#f6f7f4'));line.position.set(0,.08,19.5);world.add(line);
if(carMesh)scene.remove(carMesh);carMesh=makeCar();scene.add(carMesh);angle=0;speed=0;lap=1;lastAngle=0;finished=false;document.querySelector('#lap').textContent='1';document.querySelector('#toast').style.display='none';placeCar(0)}
function placeCar(a){carMesh.position.set(Math.sin(a)*radius,.02,Math.cos(a)*radius);carMesh.rotation.y=a;}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
function reset(){buildTrack();last=performance.now()}document.querySelector('#map').addEventListener('change',reset);document.querySelector('#restart').addEventListener('click',reset);
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!finished){if(keys.ArrowUp||keys.KeyW)speed+=12*dt;if(keys.ArrowDown||keys.KeyS)speed-=18*dt;speed*=Math.pow(.985,dt*60);speed=THREE.MathUtils.clamp(speed,-5,24);const steer=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);angle+=steer*dt*(.45+Math.abs(speed)*.045)*(speed>=0?1:-1);placeCar(angle);let progress=angle-lastAngle;if(progress< -Math.PI)progress+=Math.PI*2;if(progress>Math.PI)progress-=Math.PI*2;if(progress>0&&lastAngle>Math.PI*1.7&&angle<Math.PI*.3){lap++;if(lap>3){lap=3;finished=true;document.querySelector('#toast').style.display='block'}document.querySelector('#lap').textContent=lap}lastAngle=(angle%(Math.PI*2)+Math.PI*2)%(Math.PI*2);document.querySelector('#speed').textContent=Math.round(Math.abs(speed)*12)}
const behind=new THREE.Vector3(Math.sin(angle)*-10,6.2,Math.cos(angle)*-10);camera.position.lerp(new THREE.Vector3(carMesh.position.x+behind.x,behind.y,carMesh.position.z+behind.z),1-Math.exp(-dt*3));camera.lookAt(carMesh.position.x,.5,carMesh.position.z);renderer.render(scene,camera);requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
</script>
</body>
</html>
