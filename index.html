<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08110e"><title>Virage 3D — course arcade</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07100d;color:#f7faf8}#game{display:block;width:100vw;height:100vh}.panel{position:fixed;z-index:5;top:18px;left:18px;width:min(310px,calc(100vw - 36px));padding:18px;border:1px solid #ffffff24;border-radius:20px;background:#0d1b15eF;box-shadow:0 18px 55px #0009;backdrop-filter:blur(16px)}.eyebrow{color:#83efbb;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{margin:3px 0 13px;font-size:29px;letter-spacing:-.04em}h1 span{color:#70e6ae}label{display:block;margin:11px 0 6px;color:#afbeb6;font-size:12px;font-weight:750}select,button{width:100%;min-height:43px;border-radius:11px;font:inherit}select{border:1px solid #ffffff22;padding:0 11px;background:#1d3027;color:#f7faf8}button{margin-top:9px;border:0;background:linear-gradient(135deg,#89f6c1,#50c996);color:#092116;font-weight:900;cursor:pointer;transition:.16s}button:hover{transform:translateY(-2px);filter:brightness(1.07)}button.secondary{background:#263830;color:#edf6f1;border:1px solid #ffffff1c}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{padding:9px 10px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff0b}.stat small{display:block;color:#92a99d;font-size:9px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.stat strong{display:block;margin-top:3px;font-size:17px;font-variant-numeric:tabular-nums}.help{margin:12px 0 0;color:#b3c2b9;font-size:11px;line-height:1.55}.help b{color:#fff}.wind{position:fixed;z-index:5;right:18px;top:18px;display:flex;align-items:center;gap:10px;min-width:158px;padding:10px 12px;border:1px solid #ffffff18;border-radius:16px;background:#0d1b15df;backdrop-filter:blur(12px)}.wind-arrow{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#70e6ae18;color:#82efbd;font-size:21px}.wind-info small{display:block;color:#91a99c;font-size:9px;font-weight:900}.wind-info strong{display:block;margin-top:2px;font-size:14px}.toast{position:fixed;z-index:8;left:50%;bottom:24px;transform:translate(-50%,12px);padding:11px 18px;border:1px solid #ffffff20;border-radius:999px;background:#0d1b15ee;color:#fff;font-size:13px;font-weight:800;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}#minimap{position:fixed;z-index:4;right:18px;top:94px;width:180px;height:125px;border:1px solid #ffffff24;border-radius:15px;background:#07130fee;box-shadow:0 12px 36px #0007}.mobile{display:none}.editor,.finish{display:none;position:fixed;inset:0;z-index:10}.editor.active{display:block}.editor canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.editor-tip{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:12px 18px;border:1px solid #ffffff25;border-radius:14px;background:#101923ef;text-align:center;font-size:14px;pointer-events:none}.editor-tip strong{color:#70e6ae}.editor-tools{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;width:min(610px,calc(100% - 24px))}.editor-tools button{margin:0}.finish.active{display:grid;place-items:center;padding:20px;background:#050908b8;backdrop-filter:blur(8px)}.finish-card{width:min(390px,100%);padding:27px;border:1px solid #ffffff25;border-radius:22px;background:#102019f2;box-shadow:0 22px 80px #000c;text-align:center}.finish-card h2{margin:0 0 7px;font-size:28px}.finish-card p{margin:0 0 13px;color:#b6c5bd}
@media(max-width:600px){.panel{top:8px;left:8px;width:214px;padding:11px}.panel h1{font-size:21px;margin:2px 0 7px}.stats{gap:5px;margin-top:7px}.stat{padding:6px}.stat strong{font-size:14px}.help{display:none}.panel label{margin:7px 0 4px}.panel select,.panel button{min-height:35px;font-size:11px}.mobile{display:flex;position:fixed;z-index:5;right:10px;bottom:10px;gap:7px}.mobile button{width:52px;height:52px;margin:0;font-size:20px;touch-action:none}.wind{right:8px;top:8px;min-width:138px;padding:7px}#minimap{top:73px;right:8px;width:132px;height:92px}.editor-tip{top:8px;width:calc(100% - 16px)}.editor-tools{bottom:8px;flex-wrap:wrap}.editor-tools button{width:auto;min-width:calc(50% - 4px);min-height:40px;font-size:11px}}
</style>

<body>
<canvas id="game" aria-label="Jeu de course en 3D"></canvas><canvas id="minimap" aria-label="Mini-carte du circuit"></canvas>
<section class="panel"><div class="eyebrow">Course arcade · 3D</div><h1>VIRAGE<span>.</span></h1><label for="map">Choisis ton circuit</label><select id="map"><option value="prairie">Prairie — les grands virages</option><option value="desert">Désert — les lacets</option><option value="loop">Looping — le huit infernal</option></select><button id="drawTrack">✏️ Dessiner mon circuit</button><button class="secondary" id="restart">Recommencer la course</button><div class="stats"><div class="stat"><small>Vitesse</small><strong><span id="speed">0</span> km/h</strong></div><div class="stat"><small>Tour</small><strong><span id="lap">1</span> / 3</strong></div><div class="stat"><small>Chrono</small><strong id="time">00:00.0</strong></div><div class="stat"><small>Record</small><strong id="best">—</strong></div></div><p class="help"><b>Conduire :</b> ↑ / W accélérer · ↓ / S freiner · ← → / A D tourner<br>R pour recommencer.</p></section>
<div class="wind"><div class="wind-arrow" id="windArrow">→</div><div class="wind-info"><small>VENT</small><strong><span id="windSpeed">0</span> km/h</strong></div></div>
<div class="mobile"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>
<div class="editor" id="editor"><canvas id="drawCanvas"></canvas><div class="editor-tip"><strong>Dessine ton circuit !</strong><br>Trace une boucle fermée puis relâche.</div><div class="editor-tools"><button class="secondary" id="undoStroke">↶ Annuler</button><button class="secondary" id="clearTrack">Effacer</button><button class="secondary" id="cancelDraw">Annuler</button><button id="useTrack">Utiliser ce circuit</button></div></div>
<div class="finish" id="finishMenu"><div class="finish-card"><h2>Course terminée !</h2><p id="finishMessage">Bravo pour ces 3 tours.</p><button id="replayTrack">↻ Rejouer ce circuit</button><button class="secondary" id="redrawTrack">✏️ Redessiner le circuit</button></div></div><div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
(()=>{
const canvas=document.querySelector('#game'),mini=document.querySelector('#minimap'),mctx=mini.getContext('2d'),drawCanvas=document.querySelector('#drawCanvas'),dctx=drawCanvas.getContext('2d'),picker=document.querySelector('#map'),editor=document.querySelector('#editor'),finish=document.querySelector('#finishMenu'),TAU=Math.PI*2,SEG=900,SCALE=.05,CUSTOM='virage-custom-track';
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight,false);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,500);scene.add(new THREE.HemisphereLight(0xdff4ff,0x35402c,2.1));const sun=new THREE.DirectionalLight(0xffedcf,3.2);sun.position.set(-35,60,-25);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-80;sun.shadow.camera.right=80;sun.shadow.camera.top=80;sun.shadow.camera.bottom=-80;scene.add(sun);
const maps={prairie:{name:'Prairie',color:'#91c7e8',ground:'#679653',road:'#303a35',w:1050,h:680,width:150,point:t=>({x:900*Math.cos(t)+115*Math.cos(3*t),y:540*Math.sin(t)-65*Math.sin(2*t)})},desert:{name:'Désert',color:'#f0b879',ground:'#c89b5c',road:'#4a3b31',w:920,h:700,width:145,point:t=>({x:790*Math.cos(t)+130*Math.cos(3*t),y:565*Math.sin(t)+105*Math.sin(3*t)})},loop:{name:'Looping',color:'#a7c7f5',ground:'#6576a5',road:'#303746',w:920,h:720,width:150,point:t=>({x:720*Math.cos(t)+95*Math.cos(5*t),y:510*Math.sin(t)-115*Math.sin(3*t)})}};
let track,car,carMesh,worldGroup,cameraAngle=0,last=0,elapsed=0,lap=1,lastProgress=0,toastTimer,windA=0,windV=30,nextWind=18,bests={},strokes=[],current=null,finished=false,keys=Object.create(null),decor=[];
try{bests=JSON.parse(localStorage.getItem('virage-bests')||'{}')}catch(_){}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function resize(){const d=Math.min(devicePixelRatio||1,1.6);renderer.setPixelRatio(d);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();const md=Math.min(devicePixelRatio||1,2);mini.width=mini.clientWidth*md;mini.height=mini.clientHeight*md;mctx.setTransform(md,0,0,md,0,0);drawCanvas.width=innerWidth*md;drawCanvas.height=innerHeight*md;dctx.setTransform(md,0,0,md,0,0);if(editor.classList.contains('active'))renderEditor()}addEventListener('resize',resize);
function customData(){try{return JSON.parse(localStorage.getItem(CUSTOM)||'null')}catch(_){return null}}
function addCustom(){const c=customData(),old=picker.querySelector('[value="custom"]');if(c&&!old){const o=document.createElement('option');o.value='custom';picker.append(o)}if(c)picker.querySelector('[value="custom"]').textContent='Mon circuit — personnalisé';else old?.remove()}
function makeTrack(id){if(id==='custom'){const c=customData();if(c?.points?.length>10)return{...c,pts:c.points,color:'#9ecb83',ground:'#679653',road:'#303a35'}}const d=maps[id]||maps.prairie;return{...d,pts:Array.from({length:SEG},(_,i)=>d.point(i*TAU/SEG))}}
const v3=p=>new THREE.Vector3(p.x*SCALE,0,p.y*SCALE);
function material(color,roughness=.9){return new THREE.MeshStandardMaterial({color,roughness})}
function makeRibbon(points,width,mat,y=.04){const pos=[],idx=[];for(let i=0;i<points.length;i++){const p=points[i],prev=points[(i+points.length-1)%points.length],next=points[(i+1)%points.length],tx=(next.x-prev.x),tz=(next.y-prev.y),l=Math.hypot(tx,tz)||1,nx=-tz/l,nz=tx/l,r=width*SCALE/2;pos.push(p.x*SCALE+nx*r,y,p.y*SCALE+nz*r,p.x*SCALE-nx*r,y,p.y*SCALE-nz*r)}for(let i=0;i<points.length;i++){const a=i*2,b=((i+1)%points.length)*2;idx.push(a,b,a+1,b,b+1,a+1)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();const mesh=new THREE.Mesh(g,mat);mesh.receiveShadow=true;worldGroup.add(mesh);return mesh}
function makeCar(){const group=new THREE.Group(),body= new THREE.Mesh(new THREE.BoxGeometry(3.1,.62,1.55),material('#e83d43',.34));body.position.y=.73;body.castShadow=true;group.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.0,.22,1.46),material('#ff6464',.32));hood.position.set(1.02,.92,0);group.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.45,.65,1.22),material('#172d3a',.26));cabin.position.set(-.35,1.24,0);cabin.castShadow=true;group.add(cabin);const glass=new THREE.Mesh(new THREE.BoxGeometry(.78,.48,1.25),new THREE.MeshStandardMaterial({color:'#86d7e9',metalness:.25,roughness:.2}));glass.position.set(-.3,1.28,0);group.add(glass);const wheelMat=material('#111719',.82);for(const x of [-1,1])for(const z of [-.85,.85]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.24,16),wheelMat);wheel.rotation.x=Math.PI/2;wheel.position.set(x*.92,.42,z);wheel.castShadow=true;group.add(wheel)}const lampMat=new THREE.MeshStandardMaterial({color:'#fff0af',emissive:'#ffe68a',emissiveIntensity:2});for(const z of [-.48,.48]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.12,.16,.3),lampMat);lamp.position.set(1.58,.78,z);group.add(lamp)}const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.25,24),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.22}));shadow.rotation.x=-Math.PI/2;shadow.position.y=.035;group.add(shadow);scene.add(group);return group}
function addTree(x,z,scale,treeMat){const g=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,1.1,7),material('#62452d'));trunk.position.y=.55;trunk.castShadow=true;g.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(.68,1.8,7),treeMat);crown.position.y=1.7;crown.castShadow=true;g.add(crown);const crown2=new THREE.Mesh(new THREE.ConeGeometry(.48,1.25,7),treeMat);crown2.position.y=2.35;crown2.castShadow=true;g.add(crown2);g.position.set(x,0,z);g.scale.setScalar(scale);worldGroup.add(g)}
function buildWorld(){if(worldGroup)scene.remove(worldGroup);worldGroup=new THREE.Group();scene.add(worldGroup);scene.background=new THREE.Color(track.color);scene.fog=new THREE.Fog(track.color,75,210);sun.color.set(track.name==='Désert'?0xffd49a:0xffedcf);const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,240),material(track.ground));ground.rotation.x=-Math.PI/2;ground.position.y=-.3;ground.receiveShadow=true;worldGroup.add(ground);
makeRibbon(track.pts,track.width+34,material(track.name==='Désert'?'#9b7952':'#938c74'),-.01);makeRibbon(track.pts,track.width+16,material(track.name==='Désert'?'#d9b677':'#e7e0ca'),.025);makeRibbon(track.pts,track.width,material(track.road,.94),.055);
// Broken center markings and alternating curb blocks
const dashMat=new THREE.MeshStandardMaterial({color:'#ffffff',roughness:.8,emissive:'#222222'}),curbA=material('#f5eee0'),curbB=material('#d34a43');for(let i=0;i<track.pts.length;i+=22){const p=track.pts[i],q=track.pts[(i+3)%track.pts.length],dx=(q.x-p.x),dz=(q.y-p.y),angle=Math.atan2(dx,dz);const dash=new THREE.Mesh(new THREE.BoxGeometry(.12,.022,1.05),dashMat);dash.position.set(p.x*SCALE,.09,p.y*SCALE);dash.rotation.y=angle;worldGroup.add(dash);if(i%44===0){const prev=track.pts[(i+track.pts.length-1)%track.pts.length],nxt=track.pts[(i+1)%track.pts.length],tx=nxt.x-prev.x,tz=nxt.y-prev.y,l=Math.hypot(tx,tz)||1,nx=-tz/l,nz=tx/l;for(const side of [-1,1]){const curb=new THREE.Mesh(new THREE.BoxGeometry(.46,.045,.58),i%88===0?curbA:curbB);curb.position.set((p.x+nx*side*(track.width/2-2))*SCALE,.095,(p.y+nz*side*(track.width/2-2))*SCALE);curb.rotation.y=angle;worldGroup.add(curb)}}}
// Start line checkerboard
const start=track.pts[0],next=track.pts[2],heading=Math.atan2(next.x-start.x,next.y-start.y);for(let i=0;i<10;i++){const tile=new THREE.Mesh(new THREE.BoxGeometry(track.width*SCALE/10,.025,.62),material(i%2?'#151a18':'#f6f7f2'));tile.position.set(start.x*SCALE,.105,start.y*SCALE);tile.rotation.y=heading;tile.position.x+=(i-4.5)*Math.cos(heading)*.27;tile.position.z-=(i-4.5)*Math.sin(heading)*.27;worldGroup.add(tile)}
const treeMats=[material(track.name==='Désert'?'#53713d':'#315c3c'),material(track.name==='Désert'?'#738347':'#437247'),material('#567d45')];for(let i=8;i<track.pts.length;i+=11){const p=track.pts[i],prev=track.pts[(i+track.pts.length-2)%track.pts.length],nextp=track.pts[(i+2)%track.pts.length],tx=nextp.x-prev.x,tz=nextp.y-prev.y,l=Math.hypot(tx,tz)||1,nx=-tz/l,nz=tx/l;for(const side of [-1,1]){const distance=track.width/2+65+((i*17)%90),scale=.8+((i*7)%7)/10;addTree((p.x+nx*side*distance)*SCALE,(p.y+nz*side*distance)*SCALE,scale,treeMats[(i+side+3)%treeMats.length])}}
}
function randomWind(){windA=Math.random()*TAU;windV=18+Math.random()*38;nextWind=elapsed+18+Math.random()*12;document.querySelector('#windSpeed').textContent=Math.round(windV);document.querySelector('#windArrow').style.transform=`rotate(${windA}rad)`}
function reset(){finished=false;finish.classList.remove('active');track=makeTrack(picker.value);buildWorld();car={...track.pts[0],angle:Math.atan2(track.pts[1].y-track.pts[0].y,track.pts[1].x-track.pts[0].x),speed:0,lean:0};if(carMesh)scene.remove(carMesh);carMesh=makeCar();carMesh.position.set(car.x*SCALE,.02,car.y*SCALE);cameraAngle=car.angle;elapsed=0;lap=1;lastProgress=0;last=performance.now();randomWind();document.querySelector('#lap').textContent=lap;updateBest();toast(`${track.name} — départ !`)}
function fmt(s){const m=Math.floor(s/60),sec=(s%60).toFixed(1).padStart(4,'0');return`${String(m).padStart(2,'0')}:${sec}`}function updateBest(){const v=bests[picker.value];document.querySelector('#best').textContent=v==null?'—':fmt(v)}function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}
function nearest(){let best=Infinity,index=0,step=Math.max(1,Math.floor(track.pts.length/300));for(let i=0;i<track.pts.length;i+=step){const p=track.pts[i],d=(p.x-car.x)**2+(p.y-car.y)**2;if(d<best){best=d;index=i}}return{index,distance:Math.sqrt(best)}}
function update(dt){if(finished)return;const acc=keys.ArrowUp||keys.KeyW,brake=keys.ArrowDown||keys.KeyS,left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD,n=nearest(),onRoad=n.distance<track.width*.54,maxSpeed=onRoad?470:145;if(acc)car.speed+=310*dt;if(brake)car.speed-=430*dt;car.speed*=Math.pow(onRoad?.986:.952,dt*60);car.speed=clamp(car.speed,-90,maxSpeed);if(elapsed>=nextWind){randomWind();toast(`Rafale de vent : ${Math.round(windV)} km/h`)}const gust=windV*(.9+Math.sin(elapsed*1.7)*.1),steer=(right?1:0)-(left?1:0);car.lean+=(steer-car.lean)*Math.min(1,dt*7);car.angle+=steer*(.35+Math.min(Math.abs(car.speed)/260,1)*.85)*(car.speed>=0?1:-1)*dt+Math.sin(windA-car.angle)*gust*.00014*(onRoad?1:1.8)*dt;car.x+=Math.cos(car.angle)*car.speed*dt;car.y+=Math.sin(car.angle)*car.speed*dt;const cross=Math.sin(windA-car.angle),along=Math.cos(windA-car.angle);car.x+=Math.cos(windA)*gust*cross*.075*dt;car.y+=Math.sin(windA)*gust*cross*.075*dt;car.speed*=1-Math.max(0,-along)*gust*.00008*dt;if(!onRoad&&n.distance>track.width*.95)car.speed*=.965;
const next=nearest().index/track.pts.length;let progress=next-lastProgress;if(progress<-.5)progress+=1;if(progress>.5)progress-=1;if(progress>0&&lastProgress>.88&&next<.12&&car.speed>30){lap++;if(lap>3){const end=elapsed;if(bests[picker.value]==null||end<bests[picker.value]){bests[picker.value]=end;try{localStorage.setItem('virage-bests',JSON.stringify(bests))}catch(_){}toast(`Nouveau record : ${fmt(end)} !`)}else toast(`Course terminée : ${fmt(end)} !`);updateBest();lap=3;car.speed=0;finished=true;document.querySelector('#finishMessage').textContent=`Bravo, tu as terminé les 3 tours en ${fmt(end)}.`;finish.classList.add('active')}else toast(`Tour ${lap} / 3`);document.querySelector('#lap').textContent=lap}lastProgress=next;if(!finished)elapsed+=dt;document.querySelector('#speed').textContent=Math.round(Math.abs(car.speed)*.42);document.querySelector('#time').textContent=fmt(elapsed);
carMesh.position.set(car.x*SCALE,.03,car.y*SCALE);carMesh.rotation.y=Math.PI/2-car.angle;carMesh.rotation.z=-car.lean*.12;const fx=Math.cos(car.angle),fz=Math.sin(car.angle),desired=new THREE.Vector3((car.x-fx*13)*SCALE,7.2,(car.y-fz*13)*SCALE),look=new THREE.Vector3((car.x+fx*8)*SCALE,1.3,(car.y+fz*8)*SCALE);camera.position.lerp(desired,1-Math.exp(-dt*3.4));camera.lookAt(look);
}
function drawMini(){const w=mini.clientWidth,h=mini.clientHeight;mctx.clearRect(0,0,w,h);mctx.fillStyle='#07130f';mctx.fillRect(0,0,w,h);if(!track)return;const pad=12,xs=(w-pad*2)/(track.w*2.35),ys=(h-pad*2)/(track.h*2.35),s=Math.min(xs,ys);mctx.save();mctx.translate(w/2,h/2);mctx.scale(s,s);mctx.beginPath();track.pts.forEach((p,i)=>i?mctx.lineTo(p.x,p.y):mctx.moveTo(p.x,p.y));mctx.closePath();mctx.lineWidth=track.width;mctx.strokeStyle='#5e7065';mctx.stroke();mctx.fillStyle='#82efbb';mctx.beginPath();mctx.arc(car.x,car.y,20,0,TAU);mctx.fill();mctx.restore()}
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!editor.classList.contains('active')){update(dt);renderer.render(scene,camera);drawMini()}requestAnimationFrame(frame)}
function point(e){const r=drawCanvas.getBoundingClientRect(),m=26;return{x:clamp((e.clientX-r.left-m)/(r.width-2*m),0,1),y:clamp((e.clientY-r.top-m)/(r.height-2*m),0,1)}}function renderEditor(){const w=innerWidth,h=innerHeight;dctx.clearRect(0,0,w,h);dctx.fillStyle='#679653';dctx.fillRect(0,0,w,h);const m=26;dctx.strokeStyle='#ffffff18';dctx.lineWidth=1;for(let x=m;x<w;x+=40){dctx.beginPath();dctx.moveTo(x,m);dctx.lineTo(x,h-m);dctx.stroke()}for(let y=m;y<h;y+=40){dctx.beginPath();dctx.moveTo(m,y);dctx.lineTo(w-m,y);dctx.stroke()}const px=p=>({x:m+p.x*(w-2*m),y:m+p.y*(h-2*m)});for(const line of [...strokes,...(current?[current]:[])]){if(line.length<2)continue;dctx.beginPath();line.forEach((p,i)=>{const q=px(p);i?dctx.lineTo(q.x,q.y):dctx.moveTo(q.x,q.y)});dctx.lineJoin='round';dctx.lineCap='round';dctx.lineWidth=44;dctx.strokeStyle='#e7e0ca';dctx.stroke();dctx.lineWidth=34;dctx.strokeStyle='#303a35';dctx.stroke()}}
function openEditor(){strokes=[];current=null;finish.classList.remove('active');editor.classList.add('active');renderEditor()}drawCanvas.addEventListener('pointerdown',e=>{e.preventDefault();current=[point(e)];drawCanvas.setPointerCapture(e.pointerId);renderEditor()});drawCanvas.addEventListener('pointermove',e=>{if(!current)return;const p=point(e),l=current[current.length-1];if(Math.hypot((p.x-l.x)*innerWidth,(p.y-l.y)*innerHeight)>3){current.push(p);renderEditor()}});function endStroke(){if(current?.length>1)strokes.push(current);current=null;renderEditor()}drawCanvas.addEventListener('pointerup',endStroke);drawCanvas.addEventListener('pointercancel',endStroke);
function smooth(a){let p=a.slice();for(let pass=0;pass<2;pass++){const n=[];for(let i=0;i<p.length;i++){const x=p[i],y=p[(i+1)%p.length];n.push({x:x.x*.75+y.x*.25,y:x.y*.75+y.y*.25},{x:x.x*.25+y.x*.75,y:x.y*.25+y.y*.75})}p=n}return p}function buildCustom(){const raw=strokes.flat();if(raw.length<15){toast('Dessine un circuit un peu plus long');return null}const world=smooth(raw).map(p=>({x:(p.x-.5)*1800,y:(p.y-.5)*1300})),lens=[];let dist=0;for(let i=0;i<world.length;i++){const a=world[i],b=world[(i+1)%world.length],l=Math.hypot(b.x-a.x,b.y-a.y);lens.push(l);dist+=l}const pts=[];let seg=0,walk=0;for(let i=0;i<SEG;i++){const target=dist*i/SEG;while(seg<lens.length-1&&walk+lens[seg]<target)walk+=lens[seg++];const a=world[seg],b=world[(seg+1)%world.length],f=lens[seg]?(target-walk)/lens[seg]:0;pts.push({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f})}return{name:'Mon circuit',color:'#91c7e8',ground:'#679653',road:'#303a35',w:900,h:650,width:140,points:pts}}
document.querySelector('#drawTrack').onclick=openEditor;document.querySelector('#undoStroke').onclick=()=>{strokes.pop();renderEditor()};document.querySelector('#clearTrack').onclick=()=>{strokes=[];renderEditor()};document.querySelector('#cancelDraw').onclick=()=>editor.classList.remove('active');document.querySelector('#useTrack').onclick=()=>{const c=buildCustom();if(!c)return;try{localStorage.setItem(CUSTOM,JSON.stringify(c))}catch(_){toast('Impossible de sauvegarder');return}addCustom();picker.value='custom';editor.classList.remove('active');reset()};document.querySelector('#replayTrack').onclick=reset;document.querySelector('#redrawTrack').onclick=openEditor;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR'&&!editor.classList.contains('active'))reset()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('.mobile button').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});picker.onchange=reset;document.querySelector('#restart').onclick=reset;addCustom();resize();reset();requestAnimationFrame(frame);
})();
