<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08110e"><title>Virage — course arcade</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#07100d;color:#f7faf8}#game{display:block;width:100vw;height:100vh}.panel{position:fixed;z-index:5;top:18px;left:18px;width:min(310px,calc(100vw - 36px));padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:20px;background:linear-gradient(145deg,rgba(15,28,22,.94),rgba(9,17,14,.88));box-shadow:0 18px 55px #0009,inset 0 1px 0 #fff1;backdrop-filter:blur(16px)}.eyebrow{color:#83efbb;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{margin:3px 0 13px;font-size:29px;letter-spacing:-.04em}h1 span{color:#70e6ae}label{display:block;margin:11px 0 6px;color:#afbeb6;font-size:12px;font-weight:750}select,button{width:100%;min-height:43px;border-radius:11px;font:inherit}select{border:1px solid #ffffff22;padding:0 11px;background:#1d3027;color:#f7faf8}button{margin-top:9px;border:0;background:linear-gradient(135deg,#89f6c1,#50c996);color:#092116;font-weight:900;cursor:pointer;box-shadow:0 8px 24px #58dba92b;transition:.16s}button:hover{transform:translateY(-2px);filter:brightness(1.07)}button.secondary{background:linear-gradient(145deg,#263830,#1a2923);color:#edf6f1;border:1px solid #ffffff1c;box-shadow:none}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{padding:9px 10px;border-radius:12px;background:#ffffff0b;border:1px solid #ffffff0b}.stat small{display:block;color:#92a99d;font-size:9px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.stat strong{display:block;margin-top:3px;font-size:17px;font-variant-numeric:tabular-nums}.help{margin:12px 0 0;color:#b3c2b9;font-size:11px;line-height:1.55}.help b{color:#fff}.wind{position:fixed;z-index:5;right:18px;top:18px;display:flex;align-items:center;gap:10px;min-width:158px;padding:10px 12px;border:1px solid #ffffff18;border-radius:16px;background:#0d1b15df;box-shadow:0 12px 40px #0006;backdrop-filter:blur(12px)}.wind-arrow{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#70e6ae18;color:#82efbd;font-size:21px}.wind-info small{display:block;color:#91a99c;font-size:9px;font-weight:900}.wind-info strong{display:block;margin-top:2px;font-size:14px}.mobile{display:none}.toast{position:fixed;z-index:8;left:50%;bottom:24px;transform:translate(-50%,12px);padding:11px 18px;border:1px solid #ffffff20;border-radius:999px;background:#0d1b15ee;color:#fff;font-size:13px;font-weight:800;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.editor,.finish{display:none;position:fixed;inset:0;z-index:10}.editor.active{display:block}.editor canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}.editor-tip{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:12px 18px;border:1px solid #ffffff25;border-radius:14px;background:#101923eF;text-align:center;font-size:14px;pointer-events:none}.editor-tip strong{color:#70e6ae}.editor-tools{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;width:min(610px,calc(100% - 24px))}.editor-tools button{margin:0}.finish.active{display:grid;place-items:center;padding:20px;background:#050908b8;backdrop-filter:blur(8px)}.finish-card{width:min(390px,100%);padding:27px;border:1px solid #ffffff25;border-radius:22px;background:linear-gradient(145deg,#14251dee,#09130fee);box-shadow:0 22px 80px #000c;text-align:center}.finish-card h2{margin:0 0 7px;font-size:28px}.finish-card p{margin:0 0 13px;color:#b6c5bd}
@media(max-width:600px){.panel{top:8px;left:8px;width:214px;padding:11px}.panel h1{font-size:21px;margin:2px 0 7px}.stats{gap:5px;margin-top:7px}.stat{padding:6px}.stat strong{font-size:14px}.help{display:none}.panel label{margin:7px 0 4px}.panel select,.panel button{min-height:35px;font-size:11px}.mobile{display:flex;position:fixed;z-index:5;right:10px;bottom:10px;gap:7px}.mobile button{width:52px;height:52px;margin:0;font-size:20px}.wind{right:8px;top:8px;min-width:138px;padding:7px}.editor-tip{top:8px;width:calc(100% - 16px)}.editor-tools{bottom:8px;flex-wrap:wrap}.editor-tools button{width:auto;min-width:calc(50% - 4px);min-height:40px;font-size:11px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<section class="panel"><div class="eyebrow">Mini jeu de course</div><h1>VIRAGE<span>.</span></h1><label for="map">Choisis ton circuit</label><select id="map"><option value="prairie">Prairie — les grands virages</option><option value="desert">Désert — les lacets</option><option value="loop">Looping — le huit infernal</option></select><button id="drawTrack">✏️ Dessiner mon circuit</button><button class="secondary" id="restart">Recommencer la course</button><div class="stats"><div class="stat"><small>Vitesse</small><strong><span id="speed">0</span> km/h</strong></div><div class="stat"><small>Tour</small><strong><span id="lap">1</span> / 3</strong></div><div class="stat"><small>Chrono</small><strong id="time">00:00.0</strong></div><div class="stat"><small>Record</small><strong id="best">—</strong></div></div><p class="help"><b>Conduire :</b> ↑ / W accélérer · ↓ / S freiner · ← → / A D tourner<br>R pour recommencer.</p></section>
<div class="wind"><div class="wind-arrow" id="windArrow">→</div><div class="wind-info"><small>VENT</small><strong><span id="windSpeed">0</span> km/h</strong></div></div>
<div class="mobile"><button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div>
<div class="editor" id="editor"><canvas id="drawCanvas"></canvas><div class="editor-tip"><strong>Dessine ton circuit !</strong><br>Trace une boucle fermée puis relâche.</div><div class="editor-tools"><button class="secondary" id="undoStroke">↶ Annuler</button><button class="secondary" id="clearTrack">Effacer</button><button class="secondary" id="cancelDraw">Annuler</button><button id="useTrack">Utiliser ce circuit</button></div></div>
<div class="finish" id="finishMenu"><div class="finish-card"><h2>Course terminée !</h2><p id="finishMessage">Bravo pour ces 3 tours.</p><button id="replayTrack">↻ Rejouer ce circuit</button><button class="secondary" id="redrawTrack">✏️ Redessiner le circuit</button></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),drawCanvas=document.querySelector('#drawCanvas'),dctx=drawCanvas.getContext('2d'),picker=document.querySelector('#map'),editor=document.querySelector('#editor'),finish=document.querySelector('#finishMenu'),TAU=Math.PI*2,SEG=900,CUSTOM='virage-custom-track';
const maps={prairie:{name:'Prairie',color:'#69a85e',road:'#313a35',w:1050,h:680,width:150,accent:'#d4c6a4',point:t=>({x:900*Math.cos(t)+115*Math.cos(3*t),y:540*Math.sin(t)-65*Math.sin(2*t)})},desert:{name:'Désert',color:'#c68d50',road:'#4a3b31',w:920,h:700,width:145,accent:'#d8ba82',point:t=>({x:790*Math.cos(t)+130*Math.cos(3*t),y:565*Math.sin(t)+105*Math.sin(3*t)})},loop:{name:'Looping',color:'#56669a',road:'#303746',w:920,h:720,width:150,accent:'#8f9dbd',point:t=>({x:720*Math.cos(t)+95*Math.cos(5*t),y:510*Math.sin(t)-115*Math.sin(3*t)})}};
let track,car,cam=-Math.PI/2,last=0,elapsed=0,lap=1,lastProgress=0,toastTimer,windA=0,windV=30,nextWind=18,bests={},strokes=[],current=null,finished=false,keys=Object.create(null);
try{bests=JSON.parse(localStorage.getItem('virage-bests')||'{}')}catch(_){}
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);drawCanvas.width=innerWidth*d;drawCanvas.height=innerHeight*d;dctx.setTransform(d,0,0,d,0,0);if(editor.classList.contains('active'))renderEditor()}addEventListener('resize',resize);resize();
function customData(){try{return JSON.parse(localStorage.getItem(CUSTOM)||'null')}catch(_){return null}}
function addCustom(){const c=customData(),old=picker.querySelector('[value="custom"]');if(c&&!old){const o=document.createElement('option');o.value='custom';picker.append(o)}if(c)picker.querySelector('[value="custom"]').textContent='Mon circuit — personnalisé';else old?.remove()}
function makeTrack(id){if(id==='custom'){const c=customData();if(c?.points?.length>10)return{...c,pts:c.points}}const d=maps[id]||maps.prairie;return{...d,pts:Array.from({length:SEG},(_,i)=>d.point(i*TAU/SEG))}}
function randomWind(){windA=Math.random()*TAU;windV=18+Math.random()*38;nextWind=elapsed+18+Math.random()*12;document.querySelector('#windSpeed').textContent=Math.round(windV);document.querySelector('#windArrow').style.transform=`rotate(${windA}rad)`}
function reset(){finished=false;finish.classList.remove('active');track=makeTrack(picker.value);car={...track.pts[0],angle:Math.atan2(track.pts[1].y-track.pts[0].y,track.pts[1].x-track.pts[0].x),speed:0,lean:0};cam=-Math.PI/2;elapsed=0;lap=1;lastProgress=0;last=performance.now();randomWind();document.querySelector('#lap').textContent=lap;updateBest();toast(`${track.name} — départ !`)}
function fmt(s){const m=Math.floor(s/60),sec=(s%60).toFixed(1).padStart(4,'0');return `${String(m).padStart(2,'0')}:${sec}`}function updateBest(){const v=bests[picker.value];document.querySelector('#best').textContent=v==null?'—':fmt(v)}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1700)}
function nearest(){let best=Infinity,index=0,step=Math.max(1,Math.floor(track.pts.length/300));for(let i=0;i<track.pts.length;i+=step){const p=track.pts[i],d=(p.x-car.x)**2+(p.y-car.y)**2;if(d<best){best=d;index=i}}return{index,distance:Math.sqrt(best)}}
function update(dt){if(finished)return;const acc=keys.ArrowUp||keys.KeyW,brake=keys.ArrowDown||keys.KeyS,left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD,n=nearest(),road=n.distance<track.width*.54,max=road?470:145;if(acc)car.speed+=310*dt;if(brake)car.speed-=430*dt;car.speed*=Math.pow(road?.986:.952,dt*60);car.speed=clamp(car.speed,-90,max);if(elapsed>=nextWind){randomWind();toast(`Rafale de vent : ${Math.round(windV)} km/h`)}const gust=windV*(.9+Math.sin(elapsed*1.7)*.1),steer=(right?1:0)-(left?1:0);car.lean+=(steer-car.lean)*Math.min(1,dt*7);car.angle+=steer*(.35+Math.min(Math.abs(car.speed)/260,1)*.85)*(car.speed>=0?1:-1)*dt+Math.sin(windA-car.angle)*gust*.00014*(road?1:1.8)*dt;car.x+=Math.cos(car.angle)*car.speed*dt;car.y+=Math.sin(car.angle)*car.speed*dt;const cross=Math.sin(windA-car.angle),along=Math.cos(windA-car.angle);car.x+=Math.cos(windA)*gust*cross*.075*dt;car.y+=Math.sin(windA)*gust*cross*.075*dt;car.speed*=1-Math.max(0,-along)*gust*.00008*dt;if(!road&&n.distance>track.width*.95)car.speed*=.965;const target=-car.angle-Math.PI/2;let cd=target-cam;while(cd>Math.PI)cd-=TAU;while(cd< -Math.PI)cd+=TAU;cam+=cd*Math.min(1,dt*5);const next=nearest().index/track.pts.length;let progress=next-lastProgress;if(progress<-.5)progress+=1;if(progress>.5)progress-=1;if(progress>0&&lastProgress>.88&&next<.12&&car.speed>30){lap++;if(lap>3){const end=elapsed;if(bests[picker.value]==null||end<bests[picker.value]){bests[picker.value]=end;try{localStorage.setItem('virage-bests',JSON.stringify(bests))}catch(_){ }toast(`Nouveau record : ${fmt(end)} !`)}else toast(`Course terminée : ${fmt(end)} !`);updateBest();lap=3;car.speed=0;finished=true;document.querySelector('#finishMessage').textContent=`Bravo, tu as terminé les 3 tours en ${fmt(end)}.`;finish.classList.add('active')}else toast(`Tour ${lap} / 3`);document.querySelector('#lap').textContent=lap}lastProgress=next;if(!finished)elapsed+=dt;document.querySelector('#speed').textContent=Math.round(Math.abs(car.speed)*.42);document.querySelector('#time').textContent=fmt(elapsed)}
function draw(){const W=innerWidth,H=innerHeight;ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,W,H);sky.addColorStop(0,track.color);sky.addColorStop(1,track.name==='Désert'?'#a97743':track.name==='Looping'?'#3e4d82':'#4f8a50');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.rotate(cam);ctx.translate(-car.x,-car.y);
// Environment texture
ctx.globalAlpha=.12;ctx.fillStyle='#fff';for(let i=0;i<145;i++){const x=((i*347+73)%(track.w*2))-track.w,y=((i*229+41)%(track.h*2))-track.h;ctx.beginPath();ctx.arc(x,y,1+(i%4)*.9,0,TAU);ctx.fill()}ctx.globalAlpha=1;
// Road shadow, outer curb, asphalt
const path=()=>{ctx.beginPath();track.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath()};path();ctx.lineWidth=track.width+42;ctx.strokeStyle='#8b7d67';ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowBlur=24;ctx.shadowColor='#0006';ctx.stroke();ctx.shadowBlur=0;path();ctx.lineWidth=track.width+27;ctx.setLineDash([18,18]);ctx.strokeStyle='#f2eee2';ctx.stroke();ctx.setLineDash([]);path();ctx.lineWidth=track.width+14;ctx.strokeStyle='#c73f45';ctx.stroke();path();ctx.lineWidth=track.width;ctx.strokeStyle=track.road;ctx.stroke();
// Asphalt highlight and center line
path();ctx.lineWidth=4;ctx.setLineDash([20,25]);ctx.strokeStyle='#ffffff50';ctx.stroke();ctx.setLineDash([]);
// Start checker
const p0=track.pts[0],p1=track.pts[1],a=Math.atan2(p1.y-p0.y,p1.x-p0.x);ctx.save();ctx.translate(p0.x,p0.y);ctx.rotate(a+Math.PI/2);for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#17201b':'#f7faf8';ctx.fillRect(-track.width/2+i*track.width/10,-11,track.width/10+1,22)}ctx.restore();
// Car shadow and sporty car
ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);ctx.scale(1+Math.min(Math.abs(car.speed)/900,.08),1);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(-2,7,38,20,0,0,TAU);ctx.fill();ctx.fillStyle='#ff5d5d';ctx.beginPath();ctx.roundRect(-34,-17,68,34,10);ctx.fill();ctx.fillStyle='#d94444';ctx.fillRect(-30,-15,11,30);ctx.fillStyle='#263a4d';ctx.beginPath();ctx.roundRect(-9,-14,29,28,7);ctx.fill();ctx.fillStyle='#9ee8f2';ctx.fillRect(-5,-12,12,24);ctx.fillStyle='#fff1ad';ctx.shadowBlur=10;ctx.shadowColor='#fff1ad';ctx.fillRect(29,-12,6,6);ctx.fillRect(29,6,6,6);ctx.shadowBlur=0;ctx.fillStyle='#171d20';ctx.fillRect(-25,-20,16,5);ctx.fillRect(12,-20,16,5);ctx.fillRect(-25,15,16,5);ctx.fillRect(12,15,16,5);ctx.restore();ctx.restore();
// HUD minimap
const mw=Math.min(190,W*.31),mh=mw*.68,mx=W-mw-18,my=18;ctx.fillStyle='#07130ff2';ctx.beginPath();ctx.roundRect(mx,my,mw,mh,15);ctx.fill();ctx.strokeStyle='#ffffff18';ctx.strokeRect(mx+.5,my+.5,mw-1,mh-1);const scale=Math.min((mw-24)/(track.w*2.35),(mh-24)/(track.h*2.35));ctx.save();ctx.translate(mx+mw/2,my+mh/2);ctx.scale(scale,scale);ctx.beginPath();track.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.lineWidth=track.width*.7;ctx.strokeStyle='#66776e';ctx.stroke();ctx.fillStyle='#7cf0b2';ctx.beginPath();ctx.arc(car.x,car.y,15,0,TAU);ctx.fill();ctx.restore();
// Speed streaks
const speed=Math.abs(car.speed);if(speed>220){ctx.save();ctx.globalAlpha=Math.min(.28,speed/1800);ctx.strokeStyle='#eafff5';ctx.lineWidth=2;for(let i=0;i<18;i++){const y=(i*97+elapsed*700)%H,x=(i*163)%W;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(x<W/2?-35:35),y+50);ctx.stroke()}ctx.restore()}}
function frame(now){const dt=Math.min((now-last)/1000,.04);last=now;if(!editor.classList.contains('active')){update(dt);draw()}requestAnimationFrame(frame)}
function point(e){const r=drawCanvas.getBoundingClientRect(),m=26;return{x:clamp((e.clientX-r.left-m)/(r.width-2*m),0,1),y:clamp((e.clientY-r.top-m)/(r.height-2*m),0,1)}}
function renderEditor(){const w=innerWidth,h=innerHeight;dctx.clearRect(0,0,w,h);const g=dctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#78b96f');g.addColorStop(1,'#477d47');dctx.fillStyle=g;dctx.fillRect(0,0,w,h);const m=26;dctx.strokeStyle='#ffffff12';dctx.lineWidth=1;for(let x=m;x<w;x+=40){dctx.beginPath();dctx.moveTo(x,m);dctx.lineTo(x,h-m);dctx.stroke()}for(let y=m;y<h;y+=40){dctx.beginPath();dctx.moveTo(m,y);dctx.lineTo(w-m,y);dctx.stroke()}const px=p=>({x:m+p.x*(w-2*m),y:m+p.y*(h-2*m)});for(const line of [...strokes,...(current?[current]:[])]){if(line.length<2)continue;dctx.beginPath();line.forEach((p,i)=>{const q=px(p);i?dctx.lineTo(q.x,q.y):dctx.moveTo(q.x,q.y)});dctx.lineJoin='round';dctx.lineCap='round';dctx.lineWidth=44;dctx.strokeStyle='#8b7d67';dctx.stroke();dctx.lineWidth=34;dctx.strokeStyle='#343b40';dctx.stroke();dctx.lineWidth=3;dctx.setLineDash([18,20]);dctx.strokeStyle='#ffffff55';dctx.stroke();dctx.setLineDash([])}}
function openEditor(){strokes=[];current=null;finish.classList.remove('active');editor.classList.add('active');renderEditor()}
drawCanvas.addEventListener('pointerdown',e=>{e.preventDefault();current=[point(e)];drawCanvas.setPointerCapture(e.pointerId);renderEditor()});drawCanvas.addEventListener('pointermove',e=>{if(!current)return;const p=point(e),l=current[current.length-1];if(Math.hypot((p.x-l.x)*innerWidth,(p.y-l.y)*innerHeight)>3){current.push(p);renderEditor()}});function end(){if(current?.length>1)strokes.push(current);current=null;renderEditor()}drawCanvas.addEventListener('pointerup',end);drawCanvas.addEventListener('pointercancel',end);
function smooth(a){let p=a.slice();for(let pass=0;pass<2;pass++){const n=[];for(let i=0;i<p.length;i++){const x=p[i],y=p[(i+1)%p.length];n.push({x:x.x*.75+y.x*.25,y:x.y*.75+y.y*.25},{x:x.x*.25+y.x*.75,y:x.y*.25+y.y*.75})}p=n}return p}
function build(){const raw=strokes.flat();if(raw.length<15){toast('Dessine un circuit un peu plus long');return null}const world=smooth(raw).map(p=>({x:(p.x-.5)*1800,y:(p.y-.5)*1300})),lens=[];let dist=0;for(let i=0;i<world.length;i++){const a=world[i],b=world[(i+1)%world.length],l=Math.hypot(b.x-a.x,b.y-a.y);lens.push(l);dist+=l}const pts=[];let seg=0,walk=0;for(let i=0;i<SEG;i++){const target=dist*i/SEG;while(seg<lens.length-1&&walk+lens[seg]<target)walk+=lens[seg++];const a=world[seg],b=world[(seg+1)%world.length],f=lens[seg]?(target-walk)/lens[seg]:0;pts.push({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f})}return{name:'Mon circuit',color:'#78bd72',road:'#343b40',w:900,h:650,width:140,points:pts}}
document.querySelector('#drawTrack').onclick=openEditor;document.querySelector('#undoStroke').onclick=()=>{strokes.pop();renderEditor()};document.querySelector('#clearTrack').onclick=()=>{strokes=[];renderEditor()};document.querySelector('#cancelDraw').onclick=()=>editor.classList.remove('active');document.querySelector('#useTrack').onclick=()=>{const c=build();if(!c)return;try{localStorage.setItem(CUSTOM,JSON.stringify(c))}catch(_){toast('Impossible de sauvegarder');return}addCustom();picker.value='custom';editor.classList.remove('active');reset()};document.querySelector('#replayTrack').onclick=reset;document.querySelector('#redrawTrack').onclick=openEditor;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('.mobile button').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.prevent;keys[k]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
picker.onchange=reset;document.querySelector('#restart').onclick=reset;addCustom();reset();requestAnimationFrame(frame)
})();
</script>
</body>
</html>
